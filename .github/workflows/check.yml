name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    # 每 30 分钟跑一次（避开整点高峰）：13 分、43 分
    - cron: '13,43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          # 由仓库 Secret DOMAIN 提供, 形如:
          #   https://<host>/check?key=<SECRET>&sstp=vpn:vpn@
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Sync nodes.txt into edgetunnel KV (auto refresh)
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (compatible; gate-checker)"
          AUTH="$(EDT_ADMIN="$EDT_ADMIN" EDT_KEY="$EDT_KEY" UA="$UA" python3 -c "
          import hashlib, os
          s = os.environ['EDT_ADMIN'] + os.environ['EDT_KEY'] + os.environ['UA']
          h = hashlib.md5(s.encode()).hexdigest()
          print(hashlib.md5(h[7:27].encode()).hexdigest())
          ")"
          echo "-> POST $EDT_BASE/admin/ADD.txt"
          if curl -sS -f -X POST "$EDT_BASE/admin/ADD.txt" \
              -H "Cookie: auth=$AUTH" \
              -H "User-Agent: $UA" \
              --data-binary @public/nodes.txt; then
            echo
            echo "-> 已同步 $(grep -c . public/nodes.txt) 条节点到 edgetunnel KV"
          else
            echo "::warning::edgetunnel KV 同步失败 (订阅可能使用旧节点, 不影响 Pages 部署)"
          fi
        env:
          EDT_BASE: ${{ secrets.EDT_BASE }}
          EDT_ADMIN: ${{ secrets.EDT_ADMIN }}
          EDT_KEY: ${{ secrets.EDT_KEY }}

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (deploy outcome: ${{ steps.deployment.outcome }})"
          echo "nodes.txt: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
